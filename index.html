<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="NSC Tools">

    <title>NSC Tools</title>

    <link
        rel="stylesheet"
        href="styles.css">

</head>

<body>

    <!-- ==========================================
         HEADER
    =========================================== -->

    <header>

        <div class="container">

            <h1 id="siteTitle">
                Loading...
            </h1>

            <p id="siteSubtitle">

            </p>

            <nav
                id="tabContainer">

                <!--
                    Generated automatically
                    from tools.json
                -->

            </nav>

        </div>

    </header>

    <!-- ==========================================
         MAIN CONTENT
    =========================================== -->

    <main>

        <div class="container">

            <div
                id="toolsGrid"
                class="tools-grid">

                <!--
                    Project cards
                    are inserted here.
                -->

            </div>

        </div>

    </main>
        <!-- ==========================================
         TOOL CARD TEMPLATE
    =========================================== -->

    <template id="toolTemplate">

        <div class="tool-card">

            <div class="tool-media">

            </div>

            <div class="tool-content">

                <h2 class="project-title"></h2>

                <div class="project-version"></div>

                <p class="project-description"></p>

                <div class="project-links">

                    <!-- Buttons generated here -->

                </div>

            </div>

        </div>

    </template>


    <!-- ==========================================
         SCRIPT CARD TEMPLATE
    =========================================== -->

    <template id="scriptTemplate">

        <div class="script-card">

            <div class="script-media">

            </div>

            <div class="script-info">

                <h2 class="project-title"></h2>

                <div class="project-version"></div>

                <p class="project-description"></p>

                <div class="project-links">

                    <!-- Buttons generated here -->

                </div>

            </div>

        </div>

    </template>


    <!-- ==========================================
         IMAGE PLACEHOLDER TEMPLATE
    =========================================== -->

    <template id="imagePlaceholderTemplate">

        <div class="image-placeholder">

            <div class="placeholder-icon">

                🛠

            </div>

            <div class="placeholder-text">

                No Preview

            </div>

        </div>

    </template>


    <!-- ==========================================
         FOOTER
    =========================================== -->

    <footer>

        <div class="container">

            <span id="siteFooter">

            </span>

        </div>

    </footer>
        <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="script.js"></script>

</body>

</html>
