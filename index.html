<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NSC Tools</title>

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <h1 id="siteTitle">Loading...</h1>

        <p id="siteSubtitle"></p>

        <nav id="tabContainer">
            <!-- Generated from tools.json -->
        </nav>

    </header>

    <!-- ================= FEATURED ================= -->

    <section id="featuredSection" class="hidden">

        <div class="container">

            <h2 class="section-title">
                Featured
            </h2>

            <div
                id="featuredGrid"
                class="tools-grid">
            </div>

        </div>

    </section>

    <!-- ================= PROJECTS ================= -->

    <main class="container">

        <div
            id="toolsGrid"
            class="tools-grid">
        </div>

    </main>

    <!-- ================= FOOTER ================= -->

    <footer id="siteFooter">

    </footer>

    <!-- ================= TEMPLATES ================= -->

    <!-- Tool Card -->

    <template id="toolTemplate">

        <div class="tool-card">

            <img
                class="tool-image"
                src=""
                alt="">

            <div class="tool-content">

                <h2></h2>

                <p></p>

                <div class="buttons">

                    <a
                        class="btn btn-primary download-btn">
                    </a>

                    <a
                        class="btn docs-btn">
                        Docs
                    </a>

                </div>

            </div>

        </div>

    </template>

    <!-- Script Card -->

    <template id="scriptTemplate">

        <div class="script-card">

            <div class="script-icon-stack">

            </div>

            <div class="script-info">

                <h2></h2>

                <p></p>

                <div class="script-buttons">

                    <a
                        class="btn btn-primary download-btn">
                    </a>

                    <a
                        class="btn docs-btn">
                        Docs
                    </a>

                </div>

            </div>

        </div>

    </template>

    <!-- ================= JAVASCRIPT ================= -->

    <script src="js/script.js"></script>

</body>

</html>
